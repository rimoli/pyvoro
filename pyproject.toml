[build-system]
requires = ["setuptools>=77", "Cython>=3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvoro-rimoli"
version = "1.4.1"
description = "2D and 3D Voronoi tessellations: a Python entry point for the Voro++ library, built with the current Voro++."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause-LBNL"
license-files = ["LICENSE"]
authors = [{ name = "Joe Jordan", email = "joe.jordan@imperial.ac.uk" }]
maintainers = [{ name = "Julian Rimoli", email = "julian.rimoli@gmail.com" }]
keywords = ["geometry", "mathematics", "Voronoi", "Laguerre", "radical tessellation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/rimoli/pyvoro"
Changelog = "https://github.com/rimoli/pyvoro/blob/master/CHANGELOG.md"
"Original pyvoro" = "https://github.com/joe-jordan/pyvoro"
"Voro++" = "https://github.com/chr1shr/voro"

[tool.setuptools]
packages = ["pyvoro"]
# the wrapper sources go in the source distribution only
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
archs = ["auto64"]
test-requires = ["pytest"]
test-command = "pytest {project}/tests"
